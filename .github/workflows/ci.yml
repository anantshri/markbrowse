name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # windows-latest defaults to PowerShell, where the POSIX shell syntax the
    # Build step needs ("VAR=$(...)", pipes into tr) is not valid. GitHub-hosted
    # Windows runners ship Git Bash, so pinning the shell for the whole job
    # keeps one script working on all three platforms.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"

      - name: Build
        env:
          # Env-var indirection, never ${{ }} inside run: (GitHub
          # script-injection guidance); scrubbed because ref names may
          # legally contain quotes and other shell metacharacters.
          REF_NAME: ${{ github.ref_name }}
        run: |
          REF_NAME=$(printf '%s' "$REF_NAME" | tr -c 'A-Za-z0-9._-' '_')
          go build -trimpath -ldflags "-s -w -X main.version=${REF_NAME}" -o markbrowse .

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"

      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@v2.29.0

      - name: Gosec
        run: gosec ./...
