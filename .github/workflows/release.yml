name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          BINARY=markbrowse
          if [ "$GOOS" = "windows" ]; then
            BINARY=markbrowse.exe
          fi
          go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" -o "${BINARY}" .

      - name: Package artifact
        env:
          GOOS: ${{ matrix.goos }}
          # Env-var indirection, never ${{ }} inside run: (GitHub
          # script-injection guidance); scrubbed because tag names may
          # legally contain quotes and other shell metacharacters.
          REF_NAME: ${{ github.ref_name }}
        run: |
          REF_NAME=$(printf '%s' "$REF_NAME" | tr -c 'A-Za-z0-9._-' '_')
          BINARY=markbrowse
          if [ "$GOOS" = "windows" ]; then
            BINARY=markbrowse.exe
          fi
          ARCHIVE="markbrowse_${REF_NAME}_${GOOS}_${GOARCH}"
          mkdir "$ARCHIVE"
          cp "$BINARY" "$ARCHIVE/"
          cp README.md "$ARCHIVE/" 2>/dev/null || true
          cp LICENSE "$ARCHIVE/" 2>/dev/null || true
          tar czf "$ARCHIVE.tar.gz" "$ARCHIVE"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: markbrowse_${{ matrix.goos }}_${{ matrix.goarch }}
          path: markbrowse_*.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - name: Upload assets to draft release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: artifacts/*.tar.gz
          generate_release_notes: true
          draft: true
